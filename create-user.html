<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Створити користувача</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main class="main-content">
        <section class="auth-card">
            <h1>Новий користувач</h1>
            <form action="users.html">
                <div class="form-group">
                    <label>Логін</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Підтвердження паролю</label>
                    <input type="password" name="confirm" required>
                </div>
                <div class="form-group">
                    <label>Роль</label>
                    <select name="role">
                        <option value="regular" selected>Користувач</option>
                        <option value="admin">Адміністратор</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-success">Створити</button>
                    <a href="users.html" class="btn-danger">Скасувати</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
