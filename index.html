<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>вхід | bookstore</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main class="main-content">
        <section class="auth-card">
            <h1>Авторизація</h1>
            <form action="users.html">
                <div class="form-group">
                    <label>Логін</label>
                    <input type="text" name="login" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary btn-block">
                    Увійти
                </button>
            </form>
            <div class="auth-divider">
                <p>Немає акаунта?</p>
                <a href="register.html" class="btn-secondary btn-block" style="text-align: center; text-decoration: none; display: block; margin-top: 10px;">
                    Зареєструватися
                </a>
            </div>
        </section>
    </main>
</body>
</html>
